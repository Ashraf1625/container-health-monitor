# CSE 363 — Container Health Monitor
# Services: frontend (nginx), backend (FastAPI), db (PostgreSQL), prometheus, grafana
# Requirement coverage:
#   1. Compute:        5 containers, each isolated via Docker (namespaces + cgroups)
#   2. Networking:     monitor-net bridge; services addressed by hostname, not IP
#   3. Persistence:    db-data, prometheus-data, grafana-data named volumes
#   4. Resource mgmt:  backend and db have explicit CPU + memory limits
#   5. High Avail (B): restart: always + healthchecks on every service
#   6. Cloud deploy:   accessible on LAN via host IP or via ngrok tunnel

services:
  # ── 1. FRONTEND ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    container_name: chm-frontend
    ports:
      - "3000:80"
    networks:
      - monitor-net
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── 2. BACKEND ───────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: chm-backend
    ports:
      - "8000:8000"
    networks:
      - monitor-net
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/monitor
      CORS_ORIGINS: "*"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── 3. DATABASE ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: chm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: monitor
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - monitor-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitor"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ── 4. PROMETHEUS ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: chm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitor-net
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=7d"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── 5. GRAFANA ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: chm-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitor-net
    depends_on:
      prometheus:
        condition: service_healthy
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/main.json
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

# ── VIRTUAL NETWORK ──────────────────────────────────────────────────────────
networks:
  monitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── PERSISTENT VOLUMES ────────────────────────────────────────────────────────
volumes:
  db-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
