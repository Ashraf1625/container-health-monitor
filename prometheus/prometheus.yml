global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # ── FastAPI backend ──────────────────────────────────────────────────────
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: chm-backend

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
