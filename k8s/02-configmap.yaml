apiVersion: v1
kind: ConfigMap
metadata:
  name: chm-config
  namespace: chm
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'backend'
        static_configs:
          - targets: ['backend:8000']
  init.sql: |
    CREATE TABLE IF NOT EXISTS events (
      id SERIAL PRIMARY KEY,
      timestamp TIMESTAMP DEFAULT NOW(),
      container_name TEXT,
      event_type TEXT,
      message TEXT
    );
